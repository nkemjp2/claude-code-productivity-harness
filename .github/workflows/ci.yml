name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Three platforms, because the harness spawns child processes and resolves
    # paths, and both differ on Windows. A gate proven only on macOS is a gate
    # of unknown status everywhere else (M10).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: npm ci || npm install
      - name: Lint (nine prohibitions)
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
