name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Three platforms, because the harness spawns child processes and resolves
    # paths, and both differ on Windows. A gate proven only on macOS is a gate
    # of unknown status everywhere else (M10).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: npm ci || npm install
      - name: Lint (nine prohibitions)
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Corpus lint and licence check (G2.1, M24)
        run: npm run check:governance
      - name: Canary suite (R-F2.4)
        # A gate that has stopped firing is invisible in every other check.
        # This stages a real violation per gate and asserts the refusal.
        run: npm run canaries
      - name: Validate hooks.json (M2, M23)
        run: npm run check:hooks
      - name: Preflight — harness doctor on this platform
        # E8: doctor passing on all three platforms is a CI requirement, not a
        # single-session one. It is the only check that resolves verbs against
        # a real PATH and spawns a real child, which is where Windows differs.
        run: npm run doctor
      - name: Generated files match their source (ADR-0006)
        # The runner reads src/generated/event-map.json; docs/event-map.verified.md
        # is the source of truth. A generated file that can drift from its source
        # is a generated file nobody can trust — the same discipline hooks.json
        # gets under M2.
        run: npm run check:generated
